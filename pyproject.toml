[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftdiff"
version = "0.1.0"
description = "Visual diff for screenshots that ignores layout shifts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.26", "pillow>=10"]
keywords = ["visual-diff", "screenshot", "image-diff", "visual-regression", "change-detection", "website-monitoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Zapparelo/shiftdiff"
"Hosted version" = "https://apify.com/pegton/website-screenshot-monitor"

[project.scripts]
shiftdiff = "shiftdiff:main"

[tool.setuptools]
py-modules = ["shiftdiff"]
